name: tests

on:
  push:
    branches: [main, fix/binance-timeout-diagnostics]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q bot tests
      - run: python -m pytest -q tests scratch/test_fractal_audit_regressions.py
        env:
          MPLBACKEND: Agg
